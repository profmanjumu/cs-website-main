<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Manju's Classroom</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, 'Times New Roman', serif;
        background: #e4d4ef;
        color: #1e3a40;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-family: system-ui, sans-serif;
        font-size: clamp(4rem, 16vw, 7rem);
        font-weight: 800;
        line-height: 1;
        color: #fb8244;
      }
      p {
        margin: 0;
        font-size: 1.125rem;
        color: #4a6068;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Page not found.</p>
